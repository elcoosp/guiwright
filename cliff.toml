# git-cliff configuration — https://git-cliff.org/docs/configuration
# Style: Keep a Changelog driven by Conventional Commits.
# Used by `ci` (nothing) and `release` (changelog for the tagged release).

[changelog]
# Template for the changelog header.
header = """
<!-- git-cliff :: generated from Conventional Commits; edit history, not this file. -->

# Changelog

All notable changes to this project are documented here, generated by
[git-cliff](https://git-cliff.org) from [Conventional
Commits](https://www.conventionalcommits.org).

"""

# Template for each release section.
body = """
{% if version %}\
    {% if previous %}\
        {% if previous.commit_id and commit_id %}\
            ## [`{{ version | trim_start_matches(pat="v") }}`](https://github.com/elcoosp/guiwright/compare/{{ previous.commit_id }}...{{ commit_id }}) \
        {% else %}\
            ## {{ version | trim_start_matches(pat="v") }} \
        {% endif %}\
    {% else %}\
        ## {{ version | trim_start_matches(pat="v") }} \
    {% endif %}\
    - {{ timestamp | date(format="%Y-%m-%d") }}\
{% else %}\
    ## [Unreleased]\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
    \n### {{ group | striptags | trim | upper_first }}\n\
    {% for commit in commits %}\
        - {% if commit.scope %}\
            **{{ commit.scope }}:** \
        {% endif %}\
        {{ commit.message | upper_first }}\
        {% if commit.breaking %}\
            (**breaking**)\
        {% endif %}\
        \n\
    {% endfor %}\
{% endfor %}\n
"""

# Template for the changelog footer.
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing spaces from the rendered body.
trim = true

[git]
# Parse commits according to the Conventional Commits specification.
conventional_commits = true
# Exclude commits that are not conventional.
filter_unconventional = true
# Protect breaking changes from being skipped due to matching the ignore patterns.
protect_breaking_commits = true
# Process all commits (no splitting into individual releases).
split_commits = false
# An array of regex based parsers for modifying commit messages prior to further processing.
commit_preprocessors = [
    # Normalize "[skip ci]" style trailing markers.
    { pattern = '\s*\[skip ci\]\s*$', replace = "" },
]
# An array of regex based parsers to determine commit groups.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^bench", group = "Benchmarks" },
    { message = "^test", group = "Testing" },
    { message = "^doc", group = "Documentation" },
    { message = "^ci", group = "CI/CD" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^revert", group = "Reverted" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = ".*", group = "Other" },
]
# Exclude commits that are not matched by any parser (safety net above catches the rest).
filter_commits = false
# Regex for matching tags.
tag_pattern = "v[0-9].*"
# Keep a linear commit history for stable ordering.
topo_order = false
# Sort commits in chronological order.
sort_commits = "oldest"

[bump]
# feat → minor bump, fix → patch bump, BREAKING CHANGE → major bump.
features = { minor = ["feat"] }
breaking = { major = ["feat", "fix"], minor = ["fix"] }
# The first release of the project.
initial_tag = "v0.1.0"
