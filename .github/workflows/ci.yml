name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        # §11 CI matrix (M0 frameworks: egui + masonry)
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install lavapipe (software Vulkan, §11)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
        env:
          WGPU_BACKEND: ${{ matrix.os == 'ubuntu-latest' && 'vulkan' || '' }}

  adapter-features:
    # §18 "adapters are thin & feature-gated": the default build carries no
    # framework stack; these jobs verify the feature-gated harness glue.
    # m76: the iced job runs the REAL harness — `iced_test::Emulator`
    # driving a counter/form Program through Session (resolve → click →
    # fill; §4.6, §17 MVP trio). m79: the freya job runs its REAL harness
    # too — `freya_testing::TestingRunner` driving the counter/form app
    # through Session (the software-Skia stack compiles here).
    name: features (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - { crate: guiwright-adapter-iced, feature: iced, cmd: test }
          - { crate: guiwright-adapter-freya, feature: freya, cmd: test }
          # The slint glue runtime-tests in its own job below (m78): the
          # facade's lockfile carries skia-bindings (`links = "skia"` like
          # freya's), so the glue compiles in the slint-only `glue/slint`
          # workspace instead of the main one (recorded in
          # guiwright-adapter-slint's crate docs, §17 row 5 — re-verified
          # against slint 1.19.0 at m78).
          # Floem (M3) and GPUI (M3) ship framework-free for the same
          # family of recorded constraints: floem 0.2.0 predates the
          # HeadlessHarness, and gpui 0.2.2's Linux platform stack needs
          # system libraries (xkbcommon, wayland) a default build must
          # never require (both contracts live in the crate docs +
          # docs/m3-floem-contributions.md). Their engines are verified by
          # the normal test job; the glue lands downstream.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo ${{ matrix.adapter.cmd }} -p ${{ matrix.adapter.crate }} --features ${{ matrix.adapter.feature }} --locked

  slint-glue:
    # m78 (§4.4 door A, §17 row 5): the slint glue workspace runtime-tests
    # the REAL harness — `i-slint-backend-testing`'s TestingBackend
    # driving the real counter/form .slint app through Session (resolve →
    # click → fill, mock clock, headless take_snapshot pixels). Its own
    # workspace root: the skia-links record scopes the framework stack
    # there, so the job builds with the glue's own lockfile.
    name: slint glue (runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            glue/slint
      - run: cargo fmt --manifest-path glue/slint/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path glue/slint/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path glue/slint/Cargo.toml --locked

  clients:
    # §16 "other-language client" (M3): the TypeScript GWP client —
    # codec golden vectors (captured from Rust), client-over-TCP tests,
    # and the cross-language e2e against the real Rust demo server.
    name: clients (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Codec + client tests (node:test)
        working-directory: clients/typescript
        run: npm test
      - name: Cross-language e2e (TypeScript → Rust demo app over TCP)
        working-directory: clients/typescript
        run: npm run e2e

  bench-guard:
    name: perf budgets (§15.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Perf guard: p95 budget regressions fail the build (§15.7).
      # --release is mandatory (dev profile reports false regressions).
      - run: cargo run --release -p guiwright-bench --bin check_budgets --locked
      - name: Criterion smoke (tree_service)
        run: cargo bench -p guiwright-bench --bench tree_service --locked -- --sample-size 10 --warm-up-time 1 --measurement-time 2

  package:
    name: package (cargo package, dry-run)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-verify: internal path deps aren't on crates.io; correctness
      # is already gated by the test job.
      - run: cargo package --workspace --locked --no-verify
