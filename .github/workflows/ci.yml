name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        # §11 CI matrix (M0 frameworks: egui + masonry)
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install lavapipe (software Vulkan, §11)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
        env:
          WGPU_BACKEND: ${{ matrix.os == 'ubuntu-latest' && 'vulkan' || '' }}

  adapter-features:
    # §18 "adapters are thin & feature-gated": the default build carries no
    # framework stack; these jobs compile-verify the feature-gated harness
    # glue (M1: iced via iced_test/wgpu, freya via software Skia).
    name: features (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - { crate: guiwright-adapter-iced, feature: iced }
          - { crate: guiwright-adapter-freya, feature: freya }
          # Slint has no compile-verify job: its renderer-skia lock chain
          # claims `links = "skia"` like freya's, so no workspace can carry
          # both (recorded in guiwright-adapter-slint's crate docs, §17
          # row 5). The slint adapter ships framework-free and is verified
          # by the normal test job.
          # Floem (M3) and GPUI (M3) ship framework-free for the same
          # family of recorded constraints: floem 0.2.0 predates the
          # HeadlessHarness, and gpui 0.2.2's Linux platform stack needs
          # system libraries (xkbcommon, wayland) a default build must
          # never require (both contracts live in the crate docs +
          # docs/m3-floem-contributions.md). Their engines are verified by
          # the normal test job; the glue lands downstream.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ${{ matrix.adapter.crate }} --features ${{ matrix.adapter.feature }} --locked

  clients:
    # §16 "other-language client" (M3): the TypeScript GWP client —
    # codec golden vectors (captured from Rust), client-over-TCP tests,
    # and the cross-language e2e against the real Rust demo server.
    name: clients (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Codec + client tests (node:test)
        working-directory: clients/typescript
        run: npm test
      - name: Cross-language e2e (TypeScript → Rust demo app over TCP)
        working-directory: clients/typescript
        run: npm run e2e

  bench-guard:
    name: perf budgets (§15.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Perf guard: p95 budget regressions fail the build (§15.7).
      # --release is mandatory (dev profile reports false regressions).
      - run: cargo run --release -p guiwright-bench --bin check_budgets --locked
      - name: Criterion smoke (tree_service)
        run: cargo bench -p guiwright-bench --bench tree_service --locked -- --sample-size 10 --warm-up-time 1 --measurement-time 2

  package:
    name: package (cargo package, dry-run)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-verify: internal path deps aren't on crates.io; correctness
      # is already gated by the test job.
      - run: cargo package --workspace --locked --no-verify
