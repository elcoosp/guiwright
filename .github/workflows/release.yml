name: Release

# git-cliff driven releases: pushing a `v*.*.*` tag regenerates the
# changelog, packages the crates and publishes a GitHub Release whose
# notes come from git-cliff (§15.7-adjacent release flow).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: changelog + package + publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: git-cliff walks the whole log.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      # Gate the release on the full suite (GPU-less hosts still pass:
      # the masonry pixel test degrades to a clean `Unsupported`).
      - name: Test suite (--locked)
        run: cargo test --workspace --locked

      # The publishability gate: cargo publish --dry-run across the whole
      # workspace, verification ON. The packaged family re-resolves
      # against the LOCAL members, so this proves packaging, metadata and
      # the version graph for all 18 crates in dependency order before
      # any release artifact is cut. (Per-crate dry-runs against the
      # crates.io index only resolve once the rc.1 family's first
      # publish lands; a real token-driven publish then walks the same
      # order the justfile's `topo` carries.)
      - name: Publish dry-run (workspace, verification on)
        run: cargo publish --workspace --dry-run --locked

      - name: Release notes for this tag
        run: git-cliff --latest --strip header > RELEASE_NOTES.md

      - name: Package crates
        run: |
          cargo package --workspace --locked --no-verify
          mkdir -p dist
          cp target/package/*.crate dist/

      - name: Refresh CHANGELOG.md and commit if changed
        run: |
          git-cliff --output CHANGELOG.md
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): refresh changelog for ${GITHUB_REF_NAME} [skip ci]"
            git push
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*.crate
          fail_on_unmatched_files: true

  # The TypeScript client ships in lockstep with the Rust family (§16,
  # same-version releases): this job rides the release job (needs:
  # release — the Rust publish dry-run, packaging and GitHub release all
  # succeeded) and gates the npm artifact the same way: lockfile-pinned
  # install, the build gate (pack-surface completeness + every shipped
  # module loads + schema parses), then the publish dry-run that proves
  # the tarball (the same 11-file pack `npm pack --dry-run` lists).
  typescript-client:
    name: typescript client build + publish dry-run
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install (lockfile-pinned)
        working-directory: clients/typescript
        run: npm ci

      - name: Build gate (pack surface + module load + schema)
        working-directory: clients/typescript
        run: npm run build

      - name: Publish dry-run
        working-directory: clients/typescript
        run: npm publish --dry-run --access public
