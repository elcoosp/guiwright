[workspace]
resolver = "2"
members = [
    "crates/guiwright-core",
    "crates/guiwright-proto",
    "crates/guiwright-driver",
    "crates/guiwright-adapter-egui",
    "crates/guiwright-adapter-masonry",
    "crates/guiwright-bench",
    "crates/guiwright-shot",
    "crates/guiwright-trace",
    "crates/guiwright-adapter-iced",
    "crates/guiwright-adapter-freya",
    "crates/guiwright-macros",
    "crates/guiwright-kit",
    "crates/guiwright-inspect",
    "crates/guiwright-viewer",
    "crates/guiwright-adapter-slint",
    "crates/guiwright-adapter-floem",
    "crates/guiwright-adapter-gpui",
    "crates/guiwright-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
license-file = "LICENSE-MIT"
repository = "https://github.com/elcoosp/guiwright"
homepage = "https://github.com/elcoosp/guiwright"
description = "Playwright-grade test & automation driver for Rust GUI frameworks"
authors = ["elcoosp"]
keywords = ["gui", "testing", "accesskit", "automation", "egui"]
categories = ["development-tools::testing"]

[workspace.dependencies]
# Core substrate (the one universal dependency rule: core depends only on these)
accesskit = "0.25.2"
accesskit_consumer = "0.39.2"

# Framework adapters (latest stable on crates.io, researched 2026-11-06)
egui = "0.37.0"
masonry_core = "0.4.0"
masonry_testing = "0.4.0"

# Protocol / codec
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std"] }

# Async runtime (transport + driver host)
tokio = { version = "1.54.1", default-features = false }

# Infrastructure
thiserror = "2.0.21"
toml = "1.2.0"
tracing = "0.1.44"
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash3_64"] }

# Dev / test / bench
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"
proptest = "1.12.0"

# Internal crates
guiwright-shot = { path = "crates/guiwright-shot", version = "0.4.0" }
guiwright-trace = { path = "crates/guiwright-trace", version = "0.4.0" }
guiwright-adapter-iced = { path = "crates/guiwright-adapter-iced", version = "0.4.0" }
guiwright-adapter-freya = { path = "crates/guiwright-adapter-freya", version = "0.4.0" }
guiwright-macros = { path = "crates/guiwright-macros", version = "0.4.0" }
guiwright-kit = { path = "crates/guiwright-kit", version = "0.4.0" }
guiwright-inspect = { path = "crates/guiwright-inspect", version = "0.4.0" }
guiwright-viewer = { path = "crates/guiwright-viewer", version = "0.4.0" }
serde_json = "1.0.154"
guiwright-core = { path = "crates/guiwright-core", version = "0.4.0" }
guiwright-proto = { path = "crates/guiwright-proto", version = "0.4.0" }
guiwright-driver = { path = "crates/guiwright-driver", version = "0.4.0" }
guiwright-adapter-egui = { path = "crates/guiwright-adapter-egui", version = "0.4.0" }
guiwright-adapter-masonry = { path = "crates/guiwright-adapter-masonry", version = "0.4.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic rides the workspace table (§17 policy): every carve-out lives
# here with its rationale — in-code #[allow] attributes are forbidden
# (see CONTRIBUTING.md, "Lint policy").
pedantic = { level = "warn", priority = -1 }
# The kit/driver API is a fluent builder/DSL surface (handles, locators,
# `expect` chains, selector narrowing): must_use on every accessor call
# is noise, not signal — consuming-builder semantics are documented per
# method (both members of the must_use pair).
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Pragmatic M0 policy, carried forward: §8 selector vocabulary repeats
# module names by design (`Selector`/`resolve`), and the library surface
# predates `# Errors`/`# Panics` doc sections (tracked for the v0.2 doc
# pass — the architecture §13 cost model, not error semantics, is the
# v0.1 contract).
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# §10/§15 quantization paths convert rounded-and-clamped floats to their
# integer domain by design (the §10 pixel ramp, the µs budget rows):
# every value is range-guarded at the expression, and Rust has no
# TryFrom for float→int, so the guarded `as` IS the documented
# conversion. Rewriting it any other way hides the intent.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# The kit's `expect(locator).to_be_visible()` surface keeps the
# Playwright §16 shape: the `to_*` assertion methods consume the pending
# builder by value (single-shot assertions — see kit/app.rs).
wrong_self_convention = "allow"
# The §6.2 capability matrix rides the wire as a plain flag struct
# (`Caps` / `CapsV1`, six capability booleans): bitflag crates would
# change the wire format for no gain at this size.
struct_excessive_bools = "allow"

[profile.bench]
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
