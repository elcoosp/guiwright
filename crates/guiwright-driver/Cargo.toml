[package]
name = "guiwright-driver"
description = "In-app host: FrameworkAdapter trait, session, action scheduler, tree service wiring, GWP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["mock"]
# Scriptable in-process adapter used by driver/bench/kit tests and examples.
mock = []

[dependencies]
guiwright-core.workspace = true
accesskit.workspace = true
accesskit_consumer.workspace = true
guiwright-proto.workspace = true
guiwright-shot.workspace = true
guiwright-trace.workspace = true
guiwright-inspect.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "test-util"] }
tempfile.workspace = true

[lints.clippy]
# The session builder's `not()` (§16 assertions row, M24) keeps
# Playwright's `expect(locator).not.to*` modifier as a builder method
# on the assertion DSL: `std::ops::Not` returns `!self`, not a pending
# builder, so the trait is not implementable here. This crate does not
# inherit the workspace lints (the recorded manifest posture — the
# engine predates the pedantic table), so the carve-out lives here at
# the same policy level: table with rationale, never in-code.
should_implement_trait = "allow"
