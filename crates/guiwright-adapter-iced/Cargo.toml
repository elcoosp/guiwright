[package]
name = "guiwright-adapter-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Guiwright Level-2 adapter for iced (architecture §4.6): logical-tree engine, role registry, action routing; harness glue behind the `iced` feature"

[dependencies]
guiwright-core.workspace = true
guiwright-driver.workspace = true
accesskit.workspace = true
thiserror.workspace = true
twox-hash.workspace = true

# Framework-facing glue (§18: adapters are thin & feature-gated). The
# default build carries none of it; `--features iced` pulls the harness.
iced_test = { version = "0.14.0", optional = true }

[features]
iced = ["dep:iced_test"]

[lints]
workspace = true
