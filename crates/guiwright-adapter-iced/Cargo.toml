[package]
name = "guiwright-adapter-iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Guiwright Level-2 adapter for iced (architecture §4.6): logical-tree engine, role registry, action routing; harness glue behind the `iced` feature"

[dependencies]
guiwright-core.workspace = true
guiwright-driver.workspace = true
# The §13 overlay plan vocabulary (`show_overlay` hands one to the seam —
# the egui adapter's shape; framework-free, ungated).
guiwright-inspect.workspace = true
accesskit.workspace = true
thiserror.workspace = true
# The feature-gated harness glue hashes the harness's widget stream
# (§18 "adapters are thin & feature-gated"); the default build carries
# none of it, so the dependency rides the feature (the iced_test rule).
twox-hash = { workspace = true, optional = true }

# Framework-facing glue (§18: adapters are thin & feature-gated). The
# default build carries none of it; `--features iced` pulls the harness.
iced_test = { version = "0.14.0", optional = true }
# iced_test names no renderer backend of its own (with only its default
# features `iced_renderer::Renderer` is the `()` null renderer — zero-bounds
# text, release builds fail to compile): the CPU backend gives the harness
# real layout/text deterministically, with no GPU dependency (§11). The
# pure-Rust x11/wayland presentation backends ride along — without one,
# softbuffer compiles no backend at all and fails to build.
iced_renderer = { version = "0.14.0", optional = true, features = [
    "tiny-skia",
    "wayland",
    "x11",
] }
# The overlay layer rides `Stack` (the wrapper program composites the §13
# plan as a second child of the app's own view tree, M83).
iced_widget = { version = "0.14.0", optional = true }

[features]
iced = ["dep:iced_test", "dep:iced_renderer", "dep:iced_widget", "dep:twox-hash"]

[dev-dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "x11",
    # The ticker test's `subscription::time::every` lives on the smol
    # backend (iced_futures' thread-pool time module is a stub), so the
    # dev build carries smol for the m76 timer proof + the m85 trace row.
    "smol",
    "thread-pool",
] }
# The m85 trace validation drives the kit App's §12 recorder over the real
# Emulator session and renders the archive through the CLI's `show-trace`
# (framework-free members, dev-only — they ride the iced-feature build the
# CI adapter job runs).
guiwright-kit.workspace = true
guiwright-cli = { path = "../guiwright-cli", version = "1.0.0" }
tempfile.workspace = true
# The m86 video row reads the PNG-sequence fallback's `video.json`
# manifest (the artifact-validity half of the §10 assertions).
serde_json.workspace = true

# The m76 consumer example builds only with the harness (it drives the
# real `Emulator` path); the default build skips it.
[[example]]
name = "counter_form"
required-features = ["iced"]

[lints]
workspace = true
