[package]
name = "guiwright-bench"
description = "Criterion benchmark suites and CI perf-budget guards (architecture §15.7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

include = ["src/**", "benches/**"]

[dependencies]
guiwright-core.workspace = true
guiwright-proto.workspace = true
guiwright-driver.workspace = true
accesskit.workspace = true
postcard.workspace = true
toml.workspace = true
serde.workspace = true
twox-hash.workspace = true
guiwright-shot.workspace = true
guiwright-trace.workspace = true
guiwright-viewer.workspace = true
guiwright-kit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

[dev-dependencies]
criterion.workspace = true
# The m76 iced harness bench: the adapter rides dev-deps (benches only),
# framework-free by default — the `iced` feature below pulls the renderer
# stack. `iced_test` + `iced_widget` (no facade) name the types the bench
# app is written against; they compile backend-free until the feature
# turns on.
guiwright-adapter-iced = { path = "../guiwright-adapter-iced" }
iced_test = "0.14.0"
iced_widget = "0.14.0"

[[bench]]
name = "tree_service"
harness = false

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "iced_harness"
harness = false
required-features = ["iced"]

[features]
# The iced harness bench (the §4.6 read-back path): default builds carry
# no framework stack (§18); `--all-features` pulls it.
iced = ["guiwright-adapter-iced/iced"]

[lints]
workspace = true
