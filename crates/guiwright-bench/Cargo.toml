[package]
name = "guiwright-bench"
description = "Criterion benchmark suites and CI perf-budget guards (architecture §15.7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

include = ["src/**", "benches/**"]

[dependencies]
guiwright-core.workspace = true
guiwright-proto.workspace = true
guiwright-driver.workspace = true
accesskit.workspace = true
postcard.workspace = true
toml.workspace = true
serde.workspace = true
twox-hash.workspace = true
guiwright-shot.workspace = true
guiwright-trace.workspace = true
guiwright-viewer.workspace = true
guiwright-kit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

[dev-dependencies]
criterion.workspace = true
# The m76 iced harness bench: the adapter rides dev-deps (benches only),
# framework-free by default — the `iced` feature below pulls the renderer
# stack. `iced_test` + `iced_widget` (no facade) name the types the bench
# app is written against; they compile backend-free until the feature
# turns on.
guiwright-adapter-iced = { path = "../guiwright-adapter-iced" }
iced_test = "0.14.0"
iced_widget = "0.14.0"
# The §15.7 macro-session bench (m97): the real egui + masonry adapters —
# both workspace members, both compile headless by default (no GPU on
# the bench path: the macro session drives resolve/act/expect, not the
# pixel rows).
guiwright-adapter-egui = { path = "../guiwright-adapter-egui" }
guiwright-adapter-masonry = { path = "../guiwright-adapter-masonry" }
egui.workspace = true
# The §15.7 masonry leg's fixture (the gap the m97 bench leg's header
# named): the synthetic 1 k-node app is written against the same widget
# crates the adapter's embedded tests use — the facade's `widgets` and
# masonry-core's `NewWidget`/`WidgetTag`.
masonry = "0.4.0"
masonry_core.workspace = true
# iced_test names no renderer backend of its own (the adapter carries the
# same note on its optional deps): with only default features
# `iced_renderer` builds the null renderer and the zero-bounds
# compile_error! fires — workspace builds unify the backend through the
# adapter's dev-deps, but the standalone bench build (the CI bench-guard
# smoke on tree_service) has no such neighbor, so the CPU backend rides
# here and keeps the bench dev-dep graph self-contained, no GPU (§11).
iced_renderer = { version = "0.14.0", features = ["tiny-skia", "wayland", "x11"] }

[[bench]]
name = "tree_service"
harness = false

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "iced_harness"
harness = false
required-features = ["iced"]

[[bench]]
name = "macro_session"
harness = false

[features]
# The iced harness bench (the §4.6 read-back path): default builds carry
# no framework stack (§18); `--all-features` pulls it.
iced = ["guiwright-adapter-iced/iced"]

[lints]
workspace = true
