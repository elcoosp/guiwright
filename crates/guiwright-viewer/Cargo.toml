[package]
name = "guiwright-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Guiwright trace viewer (architecture §5.2/§12): reads gwtrace/v1 zip archives, resolves the UI tree at any frame from snapshots + diffs, emits a self-contained trace.html scrubber"

[dependencies]
guiwright-trace.workspace = true
# The M18 live mode: the feed speaks GWP through the client-side
# connection seam (ClientConn) and paces its event pump with tokio's
# timer — the runtime rides the workspace's one async substrate rule.
guiwright-proto.workspace = true
tokio = { workspace = true, features = ["time"] }
postcard.workspace = true
lz4_flex.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "9.4.1", default-features = false, features = ["time"] }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
zip = { version = "9.4.1", default-features = false, features = ["time"] }
# The M18 live-mode tests ride the driver's in-process door (the mock
# adapter + spawn_inprocess) and the proto clients — no OS socket needed.
guiwright-driver.workspace = true
guiwright-proto.workspace = true
guiwright-core.workspace = true
accesskit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }

[lints]
workspace = true
